<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fichaje QR</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
  <style>
    .dashboard-container { max-width: 500px; width: 100%; }
    .admin-section {
      margin-top: 20px;
      padding: 15px;
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      border-radius: 6px;
      text-align: left;
    }
    .admin-section h3 { margin: 0 0 10px; color: #856404; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .admin-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .admin-btns button {
      background: #343a40;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
    }
    .admin-btns button:hover { background: #23272b; }
    #userInfo { font-size: 13px; color: #666; margin-bottom: 10px; }
    #logout { background: #dc3545; color: white; border: none; border-radius: 5px; }
    #logout:hover { background: #c82333; }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <p id="userInfo"></p>
    <h2>Escanea tu QR para fichar</h2>
    <div id="reader" style="width:300px; margin: 0 auto;"></div>
    <p id="status"></p>

    <!-- Sección exclusiva para admins -->
    <div id="adminPanel" class="admin-section" style="display:none;">
      <h3>🔐 Panel de Administrador</h3>
      <div class="admin-btns">
        <button onclick="irA('empleados.html')">👤 Crear / Editar Empleados</button>
        <button onclick="irA('fichajes.html')">📋 Ver Fichajes</button>
        <button onclick="irA('terminales.html')">🖥️ Gestionar Terminales</button>
      </div>
    </div>

    <br>
    <button id="logout">Cerrar sesión</button>
  </div>

  <script>
    const user = localStorage.getItem("user");
    const rol  = localStorage.getItem("rol");

    // Proteger página
    if (!user) {
      window.location.href = "index.html";
    }

    // Mostrar info de usuario
    document.getElementById('userInfo').textContent =
      `Conectado como: ${user} (${rol === "admin" ? "Administrador" : "Empleado"})`;

    // Mostrar panel admin solo si es admin
    if (rol === "admin") {
      document.getElementById('adminPanel').style.display = "block";
    }

    function irA(pagina) {
      if (rol !== "admin") {
        alert("No tienes permisos para acceder a esta sección.");
        return;
      }
      window.location.href = pagina;
    }

    // Escaneo QR
    const status = document.getElementById('status');

    function onScanSuccess(decodedText) {
      status.textContent = `Fichaje registrado: ${decodedText}`;
      html5QrcodeScanner.stop();
    }

    var html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );

    // Logout
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem("user");
      localStorage.removeItem("rol");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
