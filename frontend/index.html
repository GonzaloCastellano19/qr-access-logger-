<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-container">
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Usuario" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="error" class="error"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDKM2Tp1sosbdAeB6qK8P73cShQ0WP76S4",
      authDomain: "basededatos-dd6b3.firebaseapp.com",
      projectId: "basededatos-dd6b3",
      storageBucket: "basededatos-dd6b3.firebasestorage.app",
      messagingSenderId: "452860965959",
      appId: "1:452860965959:web:42ecb1c31f17e55daa6d62"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Usuarios con roles definidos
    const USERS = {
      "admin":    { password: "1234",  rol: "admin" },
      "empleado1": { password: "pass1", rol: "empleado" },
      "empleado2": { password: "pass2", rol: "empleado" }
    };

    async function registrarLogin(username, rol) {
      const entrada = {
        usuario: username,
        rol: rol,
        fecha: new Date().toLocaleDateString("es-ES"),
        hora: new Date().toLocaleTimeString("es-ES"),
        timestamp: new Date().toISOString(),
        localizacion: null
      };

      // Intentar obtener geolocalización
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            entrada.localizacion = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude
            };
            await addDoc(collection(db, "logins"), entrada);
          },
          async () => {
            // Si el usuario deniega la ubicación, guardar sin ella
            await addDoc(collection(db, "logins"), entrada);
          }
        );
      } else {
        await addDoc(collection(db, "logins"), entrada);
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');

      const user = USERS[username];
      if (user && user.password === password) {
        localStorage.setItem("user", username);
        localStorage.setItem("rol", user.rol);
        await registrarLogin(username, user.rol);
        window.location.href = "dashboard.html";
      } else {
        errorEl.textContent = "Usuario o contraseña incorrectos";
      }
    });
  </script>
</body>
</html>
