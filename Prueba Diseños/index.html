<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Presencia</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <div class="grid-overlay"></div>

  <div class="wrapper">

    <!-- ══════════════════ ZONA IZQUIERDA ══════════════════ -->
    <section class="left">

      <div class="brand">
        <div class="brand-dot"></div>
        <span class="brand-name">PresenciaApp</span>
      </div>

      <div class="time-display">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date"  id="date">—</div>
      </div>

      <div class="btn-row">
        <button class="btn-fichaje btn-entrada" onclick="fichar('entrada')">
          <div class="btn-icon">&#9654;</div>
          <span class="btn-label">Entrada</span>
          <span class="btn-sub">Registrar inicio</span>
        </button>
        <button class="btn-fichaje btn-salida" onclick="fichar('salida')">
          <div class="btn-icon">&#9632;</div>
          <span class="btn-label">Salida</span>
          <span class="btn-sub">Registrar fin</span>
        </button>
      </div>

      <p class="last-record">
        Último registro: <span id="lastRecord">sin datos</span>
      </p>

    </section>

    <!-- ══════════════════ ZONA DERECHA ══════════════════ -->
    <aside class="right">

      <div class="profile-card">

        <div class="avatar-wrap">
          <div class="avatar-ring"></div>
          <div class="avatar-ring-mask"></div>
          <div class="avatar-img">
            <!--
              Para usar foto real reemplaza el contenido por:
              <img src="foto.jpg" alt="Foto de perfil" />
            -->
            &#128100;
          </div>
        </div>

        <p class="profile-name">María</p>
        <p class="profile-surname">García López</p>

        <div class="profile-divider"></div>

        <span class="profile-role">Responsable de Operaciones</span>

        <div class="stats">
          <div class="stat-box">
            <span class="stat-label">Hoy</span>
            <span class="stat-value green" id="statHoy">0h 0m</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Esta semana</span>
            <span class="stat-value" id="statSemana">0h</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Entradas</span>
            <span class="stat-value green" id="statEntradas">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Salidas</span>
            <span class="stat-value red" id="statSalidas">0</span>
          </div>
        </div>

        <div class="status-bar">
          <div class="status-dot"></div>
          <span>Sistema activo</span>
        </div>

      </div>

    </aside>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const DIAS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const MESES = ['enero','febrero','marzo','abril','mayo','junio',
                   'julio','agosto','septiembre','octubre','noviembre','diciembre'];

    function updateClock() {
      const n = new Date();
      document.getElementById('clock').textContent =
        [n.getHours(), n.getMinutes(), n.getSeconds()]
          .map(v => String(v).padStart(2,'0')).join(':');
      document.getElementById('date').textContent =
        DIAS[n.getDay()] + ', ' + n.getDate() + ' de ' +
        MESES[n.getMonth()] + ' de ' + n.getFullYear();
    }
    updateClock();
    setInterval(updateClock, 1000);

    let entradas = 0, salidas = 0;
    let horasHoy = 0, minHoy = 0;
    let entradaTs = null;

    function fichar(tipo) {
      const n    = new Date();
      const hora = n.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

      document.getElementById('lastRecord').textContent =
        (tipo === 'entrada' ? 'Entrada' : 'Salida') + ' — ' + hora;

      if (tipo === 'entrada') {
        entradas++;
        entradaTs = n;
        document.getElementById('statEntradas').textContent = entradas;
        showToast('Entrada registrada a las ' + hora);
      } else {
        salidas++;
        document.getElementById('statSalidas').textContent = salidas;
        if (entradaTs) {
          const diff = Math.floor((n - entradaTs) / 60000);
          horasHoy += Math.floor(diff / 60);
          minHoy   += diff % 60;
          if (minHoy >= 60) { horasHoy++; minHoy -= 60; }
          document.getElementById('statHoy').textContent    = horasHoy + 'h ' + minHoy + 'm';
          document.getElementById('statSemana').textContent = horasHoy + 'h';
          entradaTs = null;
        }
        showToast('Salida registrada a las ' + hora);
      }
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>

</body>
</html>
